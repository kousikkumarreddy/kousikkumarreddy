<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#7c3aed;#9333ea;#2563eb" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9333ea">
        <animate attributeName="stop-color" values="#9333ea;#2563eb;#6d28d9;#9333ea" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <text x="600" y="115"
        text-anchor="middle"
        font-family="Arial"
        font-size="58"
        font-weight="bold"
        fill="white">
    Kousik Kumar Reddy
  </text>

  <text x="600" y="175"
        text-anchor="middle"
        font-family="Arial"
        font-size="27"
        fill="white">
    Data Scientist | AI &amp; ML Engineer | Generative AI
  </text>
</svg>

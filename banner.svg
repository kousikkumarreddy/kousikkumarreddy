<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="280" viewBox="0 0 1200 280">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb">
        <animate attributeName="stop-color"
                 values="#2563eb;#7c3aed;#9333ea;#2563eb"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9333ea">
        <animate attributeName="stop-color"
                 values="#9333ea;#2563eb;#6d28d9;#9333ea"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Main heading -->
  <text x="600" y="115"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="58"
        font-weight="bold"
        fill="white">
    Kousik Kumar Reddy
  </text>

  <!-- Subtitle -->
  <text x="600" y="175"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="27"
        fill="white">
    Data Scientist | AI &amp; ML Engineer | Generative AI
  </text>

  <!-- Back wave -->
  <path fill="#172f65" opacity="0.65"
        d="M0 245
           C170 270 300 280 470 260
           C650 240 790 245 930 258
           C1040 268 1120 248 1200 235
           L1200 280 L0 280 Z">

    <animate attributeName="d"
      dur="9s"
      repeatCount="indefinite"
      values="
      M0 245 C170 270 300 280 470 260 C650 240 790 245 930 258 C1040 268 1120 248 1200 235 L1200 280 L0 280 Z;
      M0 250 C170 260 300 275 470 270 C650 250 790 240 930 250 C1040 260 1120 255 1200 242 L1200 280 L0 280 Z;
      M0 245 C170 270 300 280 470 260 C650 240 790 245 930 258 C1040 268 1120 248 1200 235 L1200 280 L0 280 Z"/>
  </path>

  <!-- Front wave -->
  <path fill="#171f50" opacity="0.85"
        d="M0 266
           C180 252 300 270 470 272
           C650 274 760 258 900 252
           C1030 246 1120 264 1200 280
           L0 280 Z">

    <animate attributeName="d"
      dur="11s"
      repeatCount="indefinite"
      values="
      M0 266 C180 252 300 270 470 272 C650 274 760 258 900 252 C1030 246 1120 264 1200 280 L0 280 Z;
      M0 260 C180 265 300 278 470 265 C650 260 760 270 900 260 C1030 250 1120 270 1200 280 L0 280 Z;
      M0 266 C180 252 300 270 470 272 C650 274 760 258 900 252 C1030 246 1120 264 1200 280 L0 280 Z"/>
  </path>

</svg>
